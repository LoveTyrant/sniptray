# Builds the Windows installer and attaches it to a draft GitHub release.
#
# To release: bump the version (package.json, package-lock.json,
# src-tauri/tauri.conf.json, src-tauri/Cargo.toml), commit, then push a
# matching tag:
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# Review the draft under Releases and publish it.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match app version $version in tauri.conf.json"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SnipTray ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## Download

            Download **SnipTray_<version>_x64-setup.exe** below and run it. It installs for your Windows account only — no admin rights needed — and SnipTray starts in the system tray.

            **"Windows protected your PC"?** The installer isn't code-signed yet, so SmartScreen may warn you. Click **More info → Run anyway**.

            ## What's new

            _Describe the changes here before publishing._
